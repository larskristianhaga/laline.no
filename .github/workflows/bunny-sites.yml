name: Deploy site
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: bunny-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      deployments: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Deploy site"
        uses: BunnyWay/actions/deploy-site@931a74b9c45ea9f9f01435fbbf1649830e67d3b3
        with:
          site: "laline"
          directory: "docs"
          api_key: ${{ secrets.BUNNYNET_API_KEY }}

      - name: "Prune old deploys"
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: |
          npm install -g @bunny.net/cli@0.19.0
          bunny sites deployments prune laline --keep 2 --force